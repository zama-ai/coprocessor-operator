# Coprocessor Helm chart: 0.13.12

commonConfig:
  databaseUser:
    valueFrom:
      secretKeyRef:
        name: coprocessor-user-rds-credentials
        key: username
  databasePassword:
    valueFrom:
      secretKeyRef:
        name: coprocessor-user-rds-credentials
        key: password
  databaseEndpoint:
    valueFrom:
      configMapKeyRef:
        name: coprocessor-config
        key: DATABASE_ENDPOINT
  databaseUrl: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_ENDPOINT)/coprocessor"
  tracing:
    enabled: true
    endpoint: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4317"

polygonContractConfigMap:
  enabled: true
  name: polygon-sc-addresses
  network: mainnet

hostListenerShared:
  image:
    name: hub.zama.org/zama-protocol/zama-ai/fhevm/coprocessor/host-listener
    tag: v0.13.0
  replicas: 1
  args:
    serviceName: mainnet-coprocessor-host-listener-polygon
  tracing:
    service: mainnet-coprocessor-host-listener-polygon
  extraArgs:
    - --initial-block-time=2
    - --catchup-finalization-in-blocks=4
    - --dependence-cache-size=10000
    - --reorg-maximum-duration-in-blocks=120
    - --log-level=INFO
    - --dependence-cross-block
    - --dependent-ops-max-per-chain=0
    - --catchup-paging=1000
  ports:
    metrics: "9100"
  serviceMonitor:
    enabled: true
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 1
      memory: 2Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: karpenter.sh/nodepool
                operator: In
                values:
                  - zws-pool
  tolerations:
    - key: karpenter.sh/nodepool
      effect: NoSchedule
      operator: Equal
      value: zws-pool
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

hostListenerPollerShared:
  image:
    name: hub.zama.org/zama-protocol/zama-ai/fhevm/coprocessor/host-listener
    tag: v0.13.2
  replicas: 1
  args:
    serviceName: mainnet-coprocessor-host-listener-poller-polygon
  tracing:
    service: mainnet-coprocessor-host-listener-poller-polygon
  extraArgs:
    - --log-level=INFO
    - --dependence-cross-block
    - --dependent-ops-max-per-chain=0
    - --finality-lag=120
  ports:
    metrics: "9100"
  serviceMonitor:
    enabled: true
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 1
      memory: 2Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: karpenter.sh/nodepool
                operator: In
                values:
                  - zws-pool
  tolerations:
    - key: karpenter.sh/nodepool
      effect: NoSchedule
      operator: Equal
      value: zws-pool
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

chains:
  - name: polygon
    wsUrlValueFrom:
      secretKeyRef:
        name: rpc-credentials
        key: polygon-rpc-ws-url
    httpUrlValueFrom:
      secretKeyRef:
        name: rpc-credentials
        key: polygon-rpc-url
    aclContractAddressValueFrom:
      configMapKeyRef:
        name: polygon-sc-addresses
        key: acl.address
    fhevmExecutorContractAddressValueFrom:
      configMapKeyRef:
        name: polygon-sc-addresses
        key: fhevm_executor.address
    kmsGenerationContractAddress: "0x0000000000000000000000000000000000000000"
    hostListener:
      enabled: true
      useLegacyName: true
      serviceName: mainnet-coprocessor-host-listener-polygon
      extraArgs:
        # Polygon PoS block on which the v0.13 host contracts were deployed.
        # TODO: Remove after the initial mainnet deployment completes successfully.
        - --start-at-block=91491593
    hostListenerPoller:
      enabled: true
      useLegacyName: true
      serviceName: mainnet-coprocessor-host-listener-poller-polygon
      extraArgs:
        # Polygon PoS block on which the v0.13 host contracts were deployed.
        # TODO: Remove after the initial mainnet deployment completes successfully.
        - --seed-start-block=91491593

dbMigration:
  enabled: false
gwListener:
  enabled: false
tfheWorker:
  enabled: false
zkProofWorker:
  enabled: false
snsWorker:
  enabled: false
txSender:
  enabled: false
