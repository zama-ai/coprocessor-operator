# NOTE: This job is meant to be run on a live Zama cluster (e.g. testnet,
# mainnet), where the database-credentials secret and network access to the
# snapshot-restore RDS exist. Point DATABASE_HOST at a snapshot-restore
# copy of the coprocessor DB — never at the live database itself.

fullnameOverride: coprocessor-db-dump

imagePullSecrets:
  - name: registry-credentials

serviceAccountName: s3-dump

image:
  repository: hub.zama.org/zama-protocol/zama.ai/aws-cli
  tag: "2.30-dev"

persistentVolumeClaim:
  enabled: true
  name: coproc-db-dump-scratch
  accessModes:
    - ReadWriteOnce
  size: 200Gi

podSecurityContext:
  fsGroup: 1000

initContainers:
  - name: pg-dump
    image:
      repository: hub.zama.org/zama-protocol/zama.ai/postgres
      tag: "18-dev"
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -euo pipefail

        : "${DATABASE_HOST:?DATABASE_HOST must be set to a snapshot-restore database}"
        : "${DATABASE_PORT:?DATABASE_PORT must be set}"
        : "${DATABASE_NAME:?DATABASE_NAME must be set}"
        : "${DATABASE_SSLMODE:?DATABASE_SSLMODE must be set}"
        : "${DATABASE_USERNAME:?DATABASE_USERNAME must be set}"
        : "${PGPASSWORD:?PGPASSWORD must be set}"
        : "${HOST_CHAIN_ID:?HOST_CHAIN_ID must be set}"

        export PGSSLMODE="$DATABASE_SSLMODE"
        DATABASE_CONNECTION="host=$DATABASE_HOST port=$DATABASE_PORT user=$DATABASE_USERNAME dbname=$DATABASE_NAME sslmode=$DATABASE_SSLMODE"

        echo "Running pre-dump cleanup on $DATABASE_HOST..."
        psql "$DATABASE_CONNECTION" \
          -v ON_ERROR_STOP=1 <<'EOSQL'

        -- 1. Create replacement index first (CONCURRENTLY cannot run in a transaction)
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_ciphertexts_created_at_v2
        ON public.ciphertexts (created_at);

        -- 2. Drop old indexes
        DROP INDEX CONCURRENTLY IF EXISTS public.idx_ciphertexts_created_at;
        DROP INDEX CONCURRENTLY IF EXISTS public.idx_ciphertexts_ciphertext128_null;

        -- 3. Drop column
        BEGIN;
        SET LOCAL lock_timeout = '5s';
        ALTER TABLE public.ciphertexts DROP COLUMN IF EXISTS ciphertext128;
        COMMIT;

        -- 4. Rename replacement index to old name
        ALTER INDEX IF EXISTS public.idx_ciphertexts_created_at_v2
        RENAME TO idx_ciphertexts_created_at;

        EOSQL

        echo ""
        echo "Block heights — record these in rds-coprocessor-db-bootstrap.yaml"
        echo "(REPLAY_START_BLOCK / GATEWAY_REPLAY_START):"
        psql "$DATABASE_CONNECTION" \
          -v ON_ERROR_STOP=1 \
          -v host_chain_id="$HOST_CHAIN_ID" <<'EOSQL'

        SELECT
          (
            SELECT MAX(block_number)
            FROM host_chain_blocks_valid
            WHERE chain_id = :'host_chain_id'
          ) AS host_chain_blocks_valid_height,
          (
            SELECT last_block_num
            FROM gw_listener_last_block
            WHERE dummy_id = true
          ) AS gw_listener_last_block_height;

        EOSQL

        echo "Dumping tables to /dump/copro_bootstrap_dir..."
        rm -rf /dump/copro_bootstrap_dir
        pg_dump \
          --host="$DATABASE_HOST" \
          --port="$DATABASE_PORT" \
          --username="$DATABASE_USERNAME" \
          --dbname="$DATABASE_NAME" \
          --format=directory \
          --jobs=8 \
          --compress=0 \
          --data-only \
          --blobs \
          --table=public.ciphertexts \
          --table=public.keys \
          --table=public.crs \
          --file=/dump/copro_bootstrap_dir

        # pg_dump creates directory-format dumps with owner-only permissions.
        # Grant the Pod fsGroup read/traverse access for the uploader container.
        chmod -R g+rX /dump/copro_bootstrap_dir

        echo "Dump complete ✅"
    env:
      - name: DATABASE_HOST
        value: "" # CHANGE ME: only use a snapshot-restore database
      - name: DATABASE_PORT
        value: "5432"
      - name: DATABASE_NAME
        value: "coprocessor"
      - name: DATABASE_SSLMODE
        value: "require"
      - name: HOST_CHAIN_ID
        value: "" # CHANGE ME: Ethereum host-chain ID (for example, 11155111 or 1)
      - name: DATABASE_USERNAME
        valueFrom:
          secretKeyRef:
            name: database-credentials
            key: username
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: database-credentials
            key: password
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    volumeMounts:
      - name: dump
        mountPath: /dump

job:
  enabled: true
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  restartPolicy: Never
  command:
    - /bin/sh
    - -c
  args:
    - |
      set -euo pipefail

      : "${S3_DUMP_URI:?S3_DUMP_URI must be set}"
      : "${AWS_DEFAULT_REGION:?AWS_DEFAULT_REGION must be set}"

      if [ ! -r /dump/copro_bootstrap_dir/toc.dat ]; then
        echo "Dump directory is missing or unreadable" >&2
        exit 1
      fi

      echo "Uploading dump to $S3_DUMP_URI..."

      aws s3 cp --no-progress /dump/copro_bootstrap_dir "$S3_DUMP_URI" --recursive

      echo "Upload complete ✅"

env:
  - name: S3_DUMP_URI
    value: "" # CHANGE ME: S3 URI for the dump directory
  - name: AWS_DEFAULT_REGION
    value: "" # CHANGE ME: AWS region containing the destination bucket

volumes:
  - name: dump
    persistentVolumeClaim:
      claimName: coproc-db-dump-scratch

volumeMounts:
  - name: dump
    mountPath: /dump
