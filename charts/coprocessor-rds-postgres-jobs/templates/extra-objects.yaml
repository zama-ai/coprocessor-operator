{{/*
Arbitrary manifests rendered alongside the Job.

Intended for small supporting objects a job needs but that do not warrant
first-class values (e.g. a ConfigMap holding an AWS CLI config file, where the
setting has no environment-variable equivalent).

Each entry is rendered through `tpl`, so values may reference the release
context — `{{ include "coprocessor-rds-postgres-jobs.namespace" . }}`,
`{{ .Release.Name }}`, and so on. Because these are unvalidated passthrough
manifests, a malformed entry surfaces as a server-side apply error rather than
a template error; run `helm template` before installing.
*/}}
{{- range .Values.extraObjects }}
---
{{ tpl (toYaml .) $ }}
{{- end }}
