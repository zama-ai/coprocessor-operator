apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coprocessor-operator-check-reader
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coprocessor-operator-check-reader
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: coprocessor-operator-check-reader
  apiGroup: rbac.authorization.k8s.io
{{- range $namespace, $secretNames := .Values.checks.k8s.secretNamesByNamespace }}
{{- if $secretNames }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coprocessor-operator-check-reader
  namespace: {{ $namespace | quote }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml $secretNames | nindent 6 }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coprocessor-operator-check-reader
  namespace: {{ $namespace | quote }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount.name }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: coprocessor-operator-check-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
