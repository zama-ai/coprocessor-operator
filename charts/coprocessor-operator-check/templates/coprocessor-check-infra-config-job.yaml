apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "coprocessor-operator-check.jobName" (dict "context" . "component" "infra-config") }}
  labels:
    app: coprocessor-operator-check
    {{- include "coprocessor-operator-check.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished | int }}
  template:
    metadata:
      labels:
        {{- include "coprocessor-operator-check.podLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      volumes:
        - name: shared-creds
          emptyDir:
            medium: Memory
      initContainers:
        - name: k8s-check
          image: {{ .Values.kubectl.image.repository }}:{{ .Values.kubectl.image.tag }}
          imagePullPolicy: Always
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              echo "{{ .Chart.Name }}:{{ .Chart.Version }}"
              {{- include "coprocessor-operator-check.runCheck" (dict "name" "k8s-check" "script" .Values.checks.k8s.script) | nindent 14 }}
        - name: aws-check
          image: {{ .Values.kubeUtils.image.repository }}:{{ .Values.kubeUtils.image.tag }}
          imagePullPolicy: Always
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              {{- include "coprocessor-operator-check.runCheck" (dict "name" "aws-check" "script" .Values.checks.aws.script) | nindent 14 }}
          env:
            - name: STORAGE_HOSTNAME
              value: {{ .Values.checks.aws.storageHostname }}
        - name: kms-check
          image: {{ .Values.ethFoundry.image.repository }}:{{ .Values.ethFoundry.image.tag }}
          imagePullPolicy: Always
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              {{- include "coprocessor-operator-check.runCheck" (dict "name" "kms-check" "script" .Values.checks.kms.script) | nindent 14 }}
          env:
            - name: AWS_KMS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.config.name }}
                  key: "AWS_KMS_KEY_ID"
        # IAM database authentication token (valid 15 minutes) for the CONNECT-only
        # check role: the RDS master secret is never read.
        - name: rds-iam-token
          image: {{ .Values.awsCli.image.repository }}:{{ .Values.awsCli.image.tag }}
          imagePullPolicy: Always
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              aws rds generate-db-auth-token \
                --hostname "$DATABASE_ADDRESS" \
                --port "$DATABASE_PORT" \
                --region "$AWS_REGION" \
                --username "$DATABASE_USER" > /shared/rds-token \
                || { rc=$?; echo "rds-iam-token exited with error (exit code $rc)"; exit "$rc"; }
          envFrom:
            - configMapRef:
                name: {{ .Values.config.name }}
          volumeMounts:
            - name: shared-creds
              mountPath: /shared
      containers:
        - name: db-check
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: Always
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              {{- include "coprocessor-operator-check.runCheck" (dict "name" "db-check" "script" .Values.checks.db.script) | nindent 14 }}
          env:
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.config.name }}
                  key: "DATABASE_USER"
          volumeMounts:
            - name: shared-creds
              mountPath: /shared
