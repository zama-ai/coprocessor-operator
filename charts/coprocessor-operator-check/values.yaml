checks:
  k8s:
    script: |
      FAILED=0

      # Reports an object that could not be read, with the kubectl error so that an RBAC
      # mismatch (Forbidden) is not mistaken for an absent object (NotFound)
      missing() {
        echo "  ✗ $1  <-- MISSING"
        echo "      $2"
        FAILED=$((FAILED + 1))
      }

      check_ns() {
        if OUT=$(kubectl get namespace "$1" -o name 2>&1); then
          echo "  ✓ namespace/$1"
        else
          missing "namespace/$1" "$OUT"
        fi
      }

      # Usage: check_secret <name> <namespace>
      check_secret() {
        if OUT=$(kubectl get secret "$1" --namespace "$2" -o name 2>&1); then
          echo "  ✓ $2/$1"
        else
          missing "$2/$1" "$OUT"
        fi
      }

      # Usage: check_externalname_svc <name> <namespace>
      check_externalname_svc() {
        if OUT=$(kubectl get service "$1" --namespace "$2" -o jsonpath='{.spec.type} {.spec.externalName}' 2>&1); then
          SVC_TYPE=${OUT%% *}
          if [ "$SVC_TYPE" = "ExternalName" ]; then
            echo "  ✓ $2/$1 (ExternalName → ${OUT#* })"
          else
            echo "  ✗ $2/$1 exists but is type $SVC_TYPE, expected ExternalName"
            FAILED=$((FAILED + 1))
          fi
        else
          missing "$2/$1" "$OUT"
        fi
      }

      # Usage: check_configmap_key <name> <namespace> <key>
      check_configmap_key() {
        if OUT=$(kubectl get configmap "$1" --namespace "$2" -o jsonpath="{.data.$3}" 2>&1); then
          if [ -n "$OUT" ]; then
            echo "  ✓ $2/$1[$3]"
          else
            echo "  ✗ $2/$1 exists but key '$3' is missing or empty"
            FAILED=$((FAILED + 1))
          fi
        else
          missing "$2/$1" "$OUT"
        fi
      }

      # Usage: check_configmap <name> <namespace>
      check_configmap() {
        if OUT=$(kubectl get configmap "$1" --namespace "$2" -o name 2>&1); then
          echo "  ✓ $2/$1"
        else
          missing "$2/$1" "$OUT"
        fi
      }

      echo "┌─────────────────────────────────────────────────"
      echo "│ k8s-check"
      echo "├─────────────────────────────────────────────────"

      echo " -- Namespaces --"
      for NS in coproc coproc-admin gw-blockchain eth-blockchain polygon-blockchain monitoring; do
        check_ns "$NS"
      done

      echo " -- Secrets --"
      for NS in coproc coproc-admin gw-blockchain eth-blockchain polygon-blockchain; do
        check_secret coprocessor-user-rds-credentials "$NS"
        check_secret registry-credentials "$NS"
      done
      check_secret rpc-credentials polygon-blockchain
      check_secret postgres-exporter-rds-credentials coproc-admin
      check_secret postgres-exporter-config monitoring
      check_secret sql-exporter-rds-credentials coproc-admin
      check_secret sql-exporter-config monitoring
      check_secret grafana-cloud-credentials monitoring

      echo " -- ExternalName services --"
      check_externalname_svc coprocessor-database coproc

      echo " -- ConfigMaps --"
      check_configmap_key db-admin-config coproc-admin RDS_ADMIN_SECRET_ID
      check_configmap_key db-admin-config coproc-admin AWS_KMS_KEY_ID
      check_configmap_key coprocessor-config coproc DATABASE_ENDPOINT
      check_configmap_key coprocessor-config coproc S3_BUCKET_NAME
      check_configmap_key coprocessor-config polygon-blockchain DATABASE_ENDPOINT
      check_configmap_key coprocessor-config polygon-blockchain S3_BUCKET_NAME
      check_configmap_key coprocessor-tx-sender gw-blockchain AWS_KEY_ID
      check_configmap eth-sc-addresses coproc
      check_configmap eth-sc-addresses eth-blockchain
      check_configmap gw-sc-addresses gw-blockchain

      if [ "$FAILED" -gt 0 ]; then
        echo "  k8s-check FAILED: $FAILED check(s). Ensure Terraform has run and secrets-bootstrap.sh has been executed."
        echo "  Forbidden means the ServiceAccount cannot read the object: add it to service_accounts.operator_check.resources in Terraform."
        echo "└─────────────────────────────────────────────────"
        exit 1
      fi
      echo "  k8s-check passed"
      echo "└─────────────────────────────────────────────────"

  aws:
    # Custom hostname fronting the coprocessor S3 bucket
    storageHostname: ""
    script: |
      echo "┌─────────────────────────────────────────────────"
      echo "│ aws-check"
      echo "├─────────────────────────────────────────────────"

      echo " -- S3 custom hostname --"
      RESPONSE=$(curl -s --max-time 10 "https://${STORAGE_HOSTNAME}")
      HTTP_STATUS=$(curl -so /dev/null -w "%{http_code}" --max-time 10 "https://${STORAGE_HOSTNAME}")
      echo "  https://${STORAGE_HOSTNAME} → $HTTP_STATUS"
      if [ "$HTTP_STATUS" = "200" ] && echo "$RESPONSE" | grep -q "ListBucketResult"; then
        echo "  ✓ S3 bucket reachable and listing confirmed"
      else
        echo "  ✗ expected 200 with ListBucketResult, got $HTTP_STATUS"
        echo "  aws-check FAILED"
        echo "└─────────────────────────────────────────────────"
        exit 1
      fi

      echo "  aws-check passed"
      echo "└─────────────────────────────────────────────────"

  kms:
    script: |
      echo "┌─────────────────────────────────────────────────"
      echo "│ kms-check"
      echo "├─────────────────────────────────────────────────"

      echo " -- tx-sender KMS key (Ethereum address) --"
      if ! ADDRESS=$(cast wallet address --aws 2>&1); then
        echo "  ✗ $ADDRESS"
        echo "  kms-check FAILED: cannot read the public key of $AWS_KMS_KEY_ID"
        echo "└─────────────────────────────────────────────────"
        exit 1
      fi
      echo "  ✓ $ADDRESS"

      echo "  kms-check passed"
      echo "└─────────────────────────────────────────────────"

  db:
    script: |
      echo "┌─────────────────────────────────────────────────"
      echo "│ db-check"
      echo "├─────────────────────────────────────────────────"

      # IAM authentication token from rds-iam-token, for a CONNECT-only role:
      # every query below only reads catalogs readable by any role.
      PGPASSWORD=$(cat /shared/rds-token)
      export PGPASSWORD

      CONN="host=coprocessor-database.coproc.svc.cluster.local port=5432 user=$DATABASE_USER dbname=coprocessor sslmode=require"

      # Fails the check on a connection, authentication or SQL error
      query() {
        if ! psql "$CONN" -c "$1"; then
          echo "  db-check FAILED"
          echo "└─────────────────────────────────────────────────"
          exit 1
        fi
      }

      echo " -- Roles (excluding system rds_*/pg_*) --"
      query "SELECT rolname, rolcanlogin, rolsuper, rolcreaterole, rolcreatedb FROM pg_roles WHERE rolname NOT LIKE 'rds_%' AND rolname NOT LIKE 'pg_%' ORDER BY rolname;"

      echo " -- Role memberships (non-system) --"
      query "SELECT m.rolname AS role, p.rolname AS member_of FROM pg_auth_members am JOIN pg_roles m ON am.member = m.oid JOIN pg_roles p ON am.roleid = p.oid WHERE m.rolname NOT LIKE 'rds_%' AND m.rolname NOT LIKE 'pg_%' ORDER BY m.rolname, p.rolname;"

      echo " -- Schema ownership (public) --"
      query "SELECT nspname AS schema_name, pg_get_userbyid(nspowner) AS schema_owner FROM pg_namespace WHERE nspname = 'public';"

      echo " -- Tables in public (owner) --"
      query "SELECT tablename, tableowner FROM pg_tables WHERE schemaname='public' ORDER BY tablename;"

      echo " -- Default privileges (pg_default_acl) --"
      query "SELECT pg_get_userbyid(d.defaclrole) AS for_role, n.nspname AS schema, d.defaclobjtype AS objtype, d.defaclacl AS acl FROM pg_default_acl d JOIN pg_namespace n ON d.defaclnamespace = n.oid ORDER BY for_role, schema;"

      echo "  db-check passed"
      echo "└─────────────────────────────────────────────────"

kubeUtils:
  image:
    repository: hub.zama.org/zama-protocol/zama-ai/security-hub/infra/kube-utils
    tag: v0.4.0

awsCli:
  image:
    repository: hub.zama.org/zama-protocol/zama.ai/aws-cli
    tag: "2.30-dev"

ethFoundry:
  image:
    repository: hub.zama.org/zama-protocol/zama-ai/security-hub/infra/eth-foundry
    tag: "0.3.1"

postgres:
  image:
    repository: hub.zama.org/zama-protocol/zama.ai/postgres
    tag: "18-dev"

kubectl:
  image:
    repository: hub.zama.org/zama-protocol/zama.ai/kubectl
    tag: "1.34-dev"

job:
  ttlSecondsAfterFinished: 300

# Extra labels applied to the check Job's pod template (e.g. for SecurityGroupPolicy selectors).
podLabels: {}

# Pod-level security context (e.g. fsGroup, runAsGroup).
podSecurityContext: {}

# Container-level security context applied to every container in the check job.
# Dropping all capabilities is safe even for containers that run as root (e.g. apk add).
securityContext:
  capabilities:
    drop:
      - ALL

imagePullSecrets:
  - name: registry-credentials

nameOverride: ""
fullnameOverride: ""

# ConfigMap published by the same module: AWS region, KMS key and database address, port and user
config:
  name: "coprocessor-operator-check"

# Least privilege service account running the checks, created with its IRSA role and RBAC by the
# terraform-coprocessor-modules k8s-coprocessor-deps module (service_accounts.operator_check)
serviceAccount:
  name: "coprocessor-operator-check"

nodeSelector: {}
tolerations: []
affinity: {}
